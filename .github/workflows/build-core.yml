name: Reusable Marble Kernel Build

on:
  workflow_call:
    outputs:
      flash_artifact_name:
        description: Uploaded flash artifact name
        value: ${{ jobs.build.outputs.flash_artifact_name }}
    inputs:
      kernel_source:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ""
      manager:
        required: true
        type: string
      manager_ref:
        required: false
        type: string
        default: ""
      enable_susfs:
        required: true
        type: boolean
      susfs_version:
        required: true
        type: string
      susfs_kernel_branch:
        required: true
        type: string
      susfs_ref:
        required: false
        type: string
        default: ""
      susfs_expected_version:
        required: false
        type: string
        default: ""
      build_scope:
        required: true
        type: string
      enable_ccache:
        required: true
        type: boolean
      toolchain:
        required: false
        type: string
        default: auto
      lto:
        required: false
        type: string
        default: thin
      artifact_label:
        required: true
        type: string
      run_policy_tests:
        required: false
        type: boolean
        default: false
      publish_step_summary:
        required: false
        type: boolean
        default: true
      cache_writer:
        description: >-
          Whether this job saves the shared ccache / ThinLTO buckets. The matrix
          elects exactly one writer; Actions cache keys are immutable, so
          parallel managers would otherwise race to upload the same key.
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      flash_artifact_name: ${{ steps.artifact-name.outputs.name }}
    env:
      GH_TOKEN: ${{ github.token }}
      KERNEL_SOURCE: ${{ inputs.kernel_source }}
      SOURCE_REF: ${{ inputs.source_ref }}
      MANAGER: ${{ inputs.manager }}
      MANAGER_REF: ${{ inputs.manager_ref }}
      ENABLE_SUSFS: ${{ inputs.enable_susfs }}
      SUSFS_VERSION: ${{ inputs.susfs_version }}
      SUSFS_KERNEL_BRANCH: ${{ inputs.susfs_kernel_branch }}
      SUSFS_REF: ${{ inputs.susfs_ref }}
      SUSFS_EXPECTED_VERSION: ${{ inputs.susfs_expected_version }}
      BUILD_SCOPE: ${{ inputs.build_scope }}
      KERNEL_DIR: kernel-source
      CCACHE_DIR: /home/runner/.ccache
      USE_CCACHE: ${{ inputs.enable_ccache }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      LTO: ${{ inputs.lto }}
      ANDROID_CLANG_BIN: ${{ github.workspace }}/android-clang/clang-r416183b/bin
      LLVM_22_1_8_BIN: ${{ github.workspace }}/llvm-22.1.8/bin

    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate builder policy
        if: ${{ inputs.run_policy_tests }}
        run: |
          for test_script in tests/test-*.sh; do
            env -u SOURCE_REPO -u SOURCE_REF -u KERNEL_SOURCE -u MANAGER -u MANAGER_REF -u ENABLE_SUSFS \
              -u SUSFS_VERSION -u SUSFS_KERNEL_BRANCH -u SUSFS_REF -u SUSFS_EXPECTED_VERSION \
              bash "${test_script}"
          done

      - name: Resolve kernel source preset
        id: kernel-source
        run: bash scripts/resolve-kernel-source.sh

      - name: Resolve toolchain
        run: bash scripts/resolve-toolchain.sh

      - name: Validate inputs
        run: bash scripts/validate-inputs.sh

      - name: Checkout kernel source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.kernel-source.outputs.source_repo }}
          ref: ${{ steps.kernel-source.outputs.source_ref }}
          path: kernel-source
          fetch-depth: 1
          persist-credentials: false

      # Optional preset-scoped overlays (e.g. pa-gr/vauxite Clang 22). No-op for other sources.
      - name: Apply kernel source-local patches
        run: bash scripts/apply-kernel-source-patches.sh

      # Relocating the hosted SDKs is a same-filesystem rename, so this returns at
      # once and the delete runs at idle priority alongside the compile instead of
      # blocking it for a minute. Space frees progressively, long before link time.
      - name: Free runner disk space
        id: disk-space
        run: bash scripts/free-disk-space.sh

      - name: Setup swap for LTO
        if: ${{ inputs.lto != 'none' }}
        uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 16

      # No clang/llvm/lld here: the pinned toolchain supplies clang, ld.lld and
      # the llvm-* binutils that LLVM=1 needs, and "Select active toolchain"
      # asserts they are all present before any compilation starts.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git jq kmod libelf-dev \
            libssl-dev file python3 python-is-python3 rsync unzip zip zstd

      - name: Restore Android kernel clang
        if: ${{ env.TOOLCHAIN == 'android-r416183b' }}
        id: android-clang-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android-clang
          key: marble-builder-clang-v3-${{ runner.os }}-${{ runner.arch }}-clang-r416183b-6e3223f

      - name: Fetch pinned Android kernel clang
        if: ${{ env.TOOLCHAIN == 'android-r416183b' }}
        run: |
          source config/marble.env
          if [[ -x "${ANDROID_CLANG_BIN}/clang" ]]; then
            "${ANDROID_CLANG_BIN}/clang" --version
            exit 0
          fi
          toolchain_repo="${RUNNER_TEMP}/android-clang-repo"
          for attempt in 1 2 3; do
            rm -rf "${toolchain_repo}"
            if git clone --filter=blob:none --no-checkout --depth=1 \
              --branch "${ANDROID_CLANG_REF}" "${ANDROID_CLANG_REPO}" "${toolchain_repo}"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Failed to fetch Android Clang repository after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          actual_commit="$(git -C "${toolchain_repo}" rev-parse HEAD)"
          if [[ "${actual_commit}" != "${ANDROID_CLANG_REF_COMMIT}" ]]; then
            echo "::error::Android Clang ref moved: expected ${ANDROID_CLANG_REF_COMMIT}, got ${actual_commit}"
            exit 1
          fi
          git -C "${toolchain_repo}" sparse-checkout set "${ANDROID_CLANG_VERSION}"
          git -C "${toolchain_repo}" checkout -q --detach "${actual_commit}"
          mkdir -p android-clang
          rm -rf "android-clang/${ANDROID_CLANG_VERSION}"
          mv "${toolchain_repo}/${ANDROID_CLANG_VERSION}" android-clang/
          rm -rf "${toolchain_repo}"
          test -x "${ANDROID_CLANG_BIN}/clang"
          "${ANDROID_CLANG_BIN}/clang" --version

      - name: Restore LLVM 22.1.8
        if: ${{ env.TOOLCHAIN == 'llvm-22.1.8' }}
        id: llvm-2218-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llvm-22.1.8
          key: marble-builder-llvm-v1-${{ runner.os }}-${{ runner.arch }}-22.1.8-df0e1ecf

      - name: Fetch LLVM 22.1.8
        if: ${{ env.TOOLCHAIN == 'llvm-22.1.8' }}
        run: |
          source config/marble.env
          if [[ -x "${LLVM_22_1_8_BIN}/clang" ]]; then
            "${LLVM_22_1_8_BIN}/clang" --version
            exit 0
          fi

          archive="${RUNNER_TEMP}/LLVM-22.1.8-Linux-X64.tar.xz"
          curl --fail --location --retry 3 --retry-delay 10 \
            --output "${archive}" "${LLVM_22_1_8_URL}"
          echo "${LLVM_22_1_8_SHA256}  ${archive}" | sha256sum -c -

          rm -rf llvm-22.1.8
          mkdir -p llvm-22.1.8
          tar -xJf "${archive}" -C llvm-22.1.8 --strip-components=1
          test -x "${LLVM_22_1_8_BIN}/clang"
          "${LLVM_22_1_8_BIN}/clang" --version

      - name: Select active toolchain
        run: |
          source config/marble.env
          case "${TOOLCHAIN}" in
            android-r416183b)
              active_bin="${ANDROID_CLANG_BIN}"
              active_id="${TOOLCHAIN}"
              active_version="${ANDROID_CLANG_VERSION}"
              active_commit="${ANDROID_CLANG_REF_COMMIT}"
              active_digest=""
              ;;
            llvm-22.1.8)
              active_bin="${LLVM_22_1_8_BIN}"
              active_id="${TOOLCHAIN}"
              active_version="LLVM 22.1.8"
              active_commit=""
              active_digest="${LLVM_22_1_8_SHA256}"
              ;;
            *)
              echo "::error::Unsupported toolchain: ${TOOLCHAIN}"
              exit 1
              ;;
          esac
          # LLVM=1 drives kbuild through the toolchain's own binutils. Assert the
          # full set now: a gap here fails in seconds instead of mid-link.
          missing=()
          for tool in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            [[ -x "${active_bin}/${tool}" ]] || missing+=("${tool}")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Toolchain ${active_id} is missing required tools in ${active_bin}: ${missing[*]}"
            exit 1
          fi
          {
            echo "ANDROID_CLANG_BIN=${active_bin}"
            echo "ACTIVE_TOOLCHAIN_ID=${active_id}"
            echo "ACTIVE_TOOLCHAIN_VERSION=${active_version}"
            echo "ACTIVE_TOOLCHAIN_COMMIT=${active_commit}"
            echo "ACTIVE_TOOLCHAIN_DIGEST=${active_digest}"
          } >> "${GITHUB_ENV}"
          "${active_bin}/clang" --version

      - name: Resolve refs
        run: bash scripts/resolve-refs.sh

      # Also runs for thin LTO so ThinLTO keys exist when ccache is disabled.
      - name: Generate cache keys
        id: cache-keys
        if: ${{ inputs.enable_ccache || inputs.lto == 'thin' }}
        run: bash scripts/generate-cache-keys.sh

      - name: Restore ccache
        id: ccache-restore
        if: ${{ inputs.enable_ccache }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-keys.outputs.ccache_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.ccache_restore_1 }}
            ${{ steps.cache-keys.outputs.ccache_restore_2 }}

      - name: Restore ThinLTO cache
        id: thinlto-restore
        if: ${{ inputs.lto == 'thin' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/thinlto
          key: ${{ steps.cache-keys.outputs.thinlto_key }}
          restore-keys: |
            ${{ steps.cache-keys.outputs.thinlto_restore_1 }}
            ${{ steps.cache-keys.outputs.thinlto_restore_2 }}

      - name: Apply manager
        run: bash scripts/patch-manager.sh

      - name: Read manager version
        run: bash scripts/read-manager-version.sh

      - name: Apply SUSFS
        run: bash scripts/apply-susfs.sh

      - name: Build kernel
        run: bash scripts/build-kernel.sh

      - name: Read manager build metadata
        run: bash scripts/read-manager-build-metadata.sh

      - name: Package AnyKernel3 zip
        run: bash scripts/package-anykernel.sh

      - name: Write build-info
        env:
          CCACHE_KEY: ${{ steps.cache-keys.outputs.ccache_key }}
          CCACHE_HIT: ${{ steps.ccache-restore.outputs.cache-hit || 'false' }}
          THINLTO_KEY: ${{ steps.cache-keys.outputs.thinlto_key }}
          THINLTO_HIT: ${{ steps.thinlto-restore.outputs.cache-hit || 'false' }}
          CACHE_WRITER: ${{ inputs.cache_writer }}
          DISK_AVAILABLE_GIB: ${{ steps.disk-space.outputs.available_gib }}
        run: bash scripts/write-build-info-txt.sh

      - name: Write build-info JSON
        run: bash scripts/write-build-info-json.sh

      - name: Audit flashable zip
        run: bash scripts/audit-flashable-zip.sh

      - name: Generate build summary
        run: |
          bash scripts/generate-build-summary.sh
          if [[ "${{ inputs.publish_step_summary }}" == "true" ]]; then
            cat kernel-source/release/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set artifact name
        id: artifact-name
        run: echo "name=marble-flash-${{ inputs.artifact_label }}-${BUILD_SCOPE}-r${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@281a49d4cbb0a72c9575a50d18f6deb515a11deb # v4
        with:
          subject-path: kernel-source/release/*.zip

      - name: Upload flashable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            kernel-source/release/*.zip
            kernel-source/release/*.zip.sha256
            kernel-source/release/build-info.txt
            kernel-source/release/build-info.json
            kernel-source/release/summary.md
            kernel-source/release/zip-audit.txt
            kernel-source/release/ccache-stats.txt
            kernel-source/release/zip-name.env

      # Text-only twin of the flash artifact. The aggregate job needs ~20 KB of
      # metadata, not every multi-hundred-MB ZIP in the matrix.
      - name: Upload metadata artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marble-meta-${{ inputs.artifact_label }}-${{ inputs.build_scope }}-r${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            kernel-source/release/build-info.txt
            kernel-source/release/build-info.json
            kernel-source/release/summary.md
            kernel-source/release/zip-audit.txt
            kernel-source/release/ccache-stats.txt
            kernel-source/release/zip-name.env

      # Object caches save even when the build fails (e.g. OOM at 90% compile),
      # so the next run reuses the partial work. Never on cancel. Actions cache
      # keys are immutable, so skip when this run restored an exact hit, and only
      # the elected writer uploads — otherwise parallel managers race for one key.
      # Product artifacts (ZIP, release) stay success-only above.
      - name: Save ccache
        if: ${{ always() && inputs.enable_ccache && inputs.cache_writer && !cancelled() && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-keys.outputs.ccache_key }}

      - name: Save ThinLTO cache
        if: ${{ always() && inputs.lto == 'thin' && inputs.cache_writer && !cancelled() && steps.thinlto-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/.cache/thinlto
          key: ${{ steps.cache-keys.outputs.thinlto_key }}
