name: Marble Builder Preflight

on:
  # Every branch, not just main: a shellcheck break caught here costs a minute,
  # the same break caught by a build costs forty.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install static check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      # `bash f1 f2` runs only f1 and passes the rest as positional arguments, so
      # both of these have to loop. They previously did not, which meant the
      # syntax check covered one file and the "full suite" ran one test.
      - name: Run shell syntax checks
        run: |
          for script in scripts/*.sh scripts/lib/*.sh tests/*.sh; do
            bash -n "${script}"
          done

      - name: Run shellcheck
        run: shellcheck -e SC1090,SC1091,SC2016,SC2153,SC2154 scripts/*.sh scripts/lib/*.sh tests/*.sh

      - name: Run actionlint
        run: actionlint

      - name: Run policy tests
        run: |
          failed=0
          for test_script in tests/test-*.sh; do
            echo "::group::${test_script}"
            # Related env vars are unset so ambient CI env cannot fake a pass.
            if env -u SOURCE_REPO -u SOURCE_REF -u KERNEL_SOURCE -u MANAGER -u MANAGER_REF \
              -u ENABLE_SUSFS -u SUSFS_VERSION -u SUSFS_KERNEL_BRANCH -u SUSFS_REF \
              -u SUSFS_EXPECTED_VERSION bash "${test_script}"
            then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::${test_script} failed"
              failed=1
            fi
          done
          exit "${failed}"

      - name: Check whitespace
        run: git diff --check
